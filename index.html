}>{"≥ "+fH(oR)+" → 10/10 · 50% à "+fH(oR*0.75)}</div><Sld value={oR} onChange={v=>{setOR(v);saveSettings(oS,v,oTP,dayObjs);}} max={14} step={0.5} color={C.tr} formatVal={fH}/><div style={{display:"flex",alignItems:"center",gap:6,marginBottom:2,marginTop:4}}><Ic n="Sun" size={13} color={C.hy} sw={2}/><span style={{fontSize:11.5,fontWeight:700,color:C.tx}}>Temps personnel</span></div><div style={{fontSize:9,color:C.mu,marginBottom:9}}>{"≥ "+fH(oTP)+" → 10/10"}</div><Sld value={oTP} onChange={v=>{setOTP(v);saveSettings(oS,oR,v,dayObjs);}} max={10} step={0.5} color={C.hy} formatVal={fH}/></div><div style={sL}><div style={sLT}>Objectifs par jour de semaine</div><div style={{fontSize:9,color:C.mu,marginTop:4}}>Active le toggle d'un jour pour définir des objectifs spécifiques.</div></div><div style={{...sBx,overflow:"hidden"}}>{DOW_ORDER.map(dow=><DayObjRow key={dow} dow={dow}/>)}</div><div style={sL}><div style={sLT}>Statistiques</div></div><div style={sBx}><SRow icon="CalendarCheck" title="Journées remplies" right={nb+" / "+TOTAL_DAYS}/><SRow icon="CalendarRange" title="Période couverte" sub={firstDay&&lastDay?fD(firstDay)+" → "+fD(lastDay):"Aucune donnée"}/><SRow icon="ChartPie" title="Complétion" right={Math.round((nb/TOTAL_DAYS)*100)+" %"}/></div><div style={sL}><div style={sLT}>Formules</div></div><div style={sBx}><SRow icon="Sparkles" title="Score du jour /10" sub="Rév.×1.8 + Somm.×1.8 + Conc.×1.4×ratio + Eff.×1.2×ratio + Stress inv.×1.0 + Alim.×0.8 + Humeur×0.4 + T.perso×0.3 + Satisf.×0.3 + Sport(+8) + Pauses(+2)"/><SRow icon="Leaf" title="Hygiène /10" sub="Sommeil 40% + Sport 20% + Alimentation 25% + Temps perso 15%"/><SRow icon="Brain" title="État mental /10" sub="Stress inversé 40% + Humeur 35% + Satisfaction 25%"/><SRow icon="Target" title="Performance /10" sub="Révisions 45% + Conc. 25%×ratio + Eff. 20%×ratio + Pauses 10%"/></div><div style={sL}><div style={sLT}>Données</div></div><div style={sBx}>{!resetConfirm?<SRow icon="Trash2" title="Réinitialiser toutes les données" sub="Supprime définitivement toutes les journées" onClick={nb>0?function(){setResetConfirm(true);}:undefined} danger/>:<div style={{padding:"15px 16px",background:TINT.badBg,borderBottom:"1px solid "+C.bd}}><div style={{display:"flex",alignItems:"center",gap:6,fontSize:12.5,fontWeight:700,color:C.st,marginBottom:5}}><Ic n="TriangleAlert" size={15} color={C.st} sw={2}/>Confirmer la suppression ?</div><div style={{fontSize:10,color:TINT.badTx,marginBottom:13}}>Action irréversible. {nb} journées effacées.</div><div style={{display:"flex",gap:8}}><button onClick={()=>setResetConfirm(false)} style={{flex:1,background:C.bg,border:"1px solid "+C.bd,borderRadius:11,padding:"10px",cursor:"pointer",fontWeight:600,fontSize:11,color:C.tx}}>Annuler</button><button onClick={()=>{onReset();setResetConfirm(false);onClose();}} style={{flex:1,background:C.st,color:"#fff",border:"none",borderRadius:11,padding:"10px",cursor:"pointer",fontWeight:700,fontSize:11}}>Tout supprimer</button></div></div>}</div><div style={sL}><div style={sLT}>À propos</div></div><div style={sBx}><SRow icon="Activity" title="PASS Tracker" sub="Suivi quotidien PASS 2026–2027 · Données cloud Supabase" right="v6.0"/></div></div></div></div>);
}

// ── MAIN APP ──
function App(){
  const [page,setPage]=useState("dash");
  const [entries,setEntries]=useState({});
  const [sel,setSel]=useState(DATE_MIN);
  const [form,setForm]=useState(makeE0());
  const [loading,setLoading]=useState(true);
  const [saveAnim,setSaveAnim]=useState(false);
  const [showCal,setShowCal]=useState(false);
  const [showSettings,setShowSettings]=useState(false);
  const [catV,setCatV]=useState({jour:true,hyg:true,mental:true,perf:true});
  const [per,setPer]=useState("mensuel");
  const [stab,setStab]=useState("journal");
  const [jtab,setJtab]=useState("jours");
  const [selMets,setSelMets]=useState(new Set(["jour","hyg","mental","perf"]));
  const [scoreMode,setScoreMode]=useState("daily");
  const [editDay,setEditDay]=useState(null);
  const [deleteConfirm,setDeleteConfirm]=useState(null);
  const [revPer,setRevPer]=useState("hebdo");
  const [oS,setOS]=useState(8);
  const [oR,setOR]=useState(9);
  const [oTP,setOTP]=useState(2);
  const [dayObjs,setDayObjs]=useState({});
  const [syncStatus,setSyncStatus]=useState("ok"); // "ok"|"saving"|"error"

  async function saveSettings(s,r,tp,dObjs){
    try{await sb.from("settings").upsert({id:1,os:s,or_val:r,otp:tp,day_objs:dObjs||{}});}catch(ex){console.error(ex);}
  }

  async function saveEntry(date,data){
    setSyncStatus("saving");
    try{
      await sb.from("entries").upsert({date,data},{onConflict:"date"});
      setSyncStatus("ok");
    }catch(ex){setSyncStatus("error");console.error(ex);}
  }

  async function deleteEntry(date){
    setSyncStatus("saving");
    try{await sb.from("entries").delete().eq("date",date);setSyncStatus("ok");}catch(ex){setSyncStatus("error");}
  }

  useEffect(function(){
    (async function(){
      try{
        const {data:rows}=await sb.from("entries").select("date,data");
        if(rows){const e={};rows.forEach(r=>{e[r.date]=r.data;});setEntries(e);}
      }catch(ex){console.error(ex);}
      try{
        const {data:sv}=await sb.from("settings").select("*").eq("id",1).single();
        if(sv){if(sv.os!=null)setOS(sv.os);if(sv.or_val!=null)setOR(sv.or_val);if(sv.otp!=null)setOTP(sv.otp);if(sv.day_objs)setDayObjs(sv.day_objs);}
      }catch(ex){console.error(ex);}
      setLoading(false);
    })();
  },[]);

  useEffect(function(){
    if(entries[sel]&&!entries[sel]._repos){const copy=Object.assign({},entries[sel]);delete copy._locked;setForm(copy);}
    else setForm(makeE0());
  },[sel,entries]);

  useEffect(function(){if(!saveAnim)return;const t=setTimeout(()=>setSaveAnim(false),1200);return()=>clearTimeout(t);},[saveAnim]);

  function sf(k,v){setForm(function(p){const n=Object.assign({},p);n[k]=v;return n;});}
  function toggleMet(k){setSelMets(function(p){const n=new Set(p);n.has(k)?n.delete(k):n.add(k);return n;});}

  const isLocked=!!(entries[sel]&&entries[sel]._locked&&!entries[sel]._repos);
  const isRepos=!!(entries[sel]&&entries[sel]._repos);
  const selDow=useMemo(()=>new Date(sel+"T00:00:00").getDay(),[sel]);
  const selObj=useMemo(()=>getObjForDay(selDow,oS,oR,oTP,dayObjs),[selDow,oS,oR,oTP,dayObjs]);
  const hasDayObj=!!dayObjs[String(selDow)];

  async function doSave(){
    const data=Object.assign({},form,{_locked:true});
    const ne=Object.assign({},entries);ne[sel]=data;
    setEntries(ne);setSaveAnim(true);
    await saveEntry(sel,data);
    const next=computeNextDay(ne);
    setTimeout(()=>setSel(next),700);
  }
  async function doSaveRepos(){
    const data={_repos:true,_locked:true};
    const ne=Object.assign({},entries);ne[sel]=data;
    setEntries(ne);setSaveAnim(true);
    await saveEntry(sel,data);
    const next=computeNextDay(ne);
    setTimeout(()=>setSel(next),700);
  }
  async function doUnlock(){const copy=Object.assign({},entries[sel]);delete copy._locked;const ne=Object.assign({},entries);ne[sel]=copy;setEntries(ne);await saveEntry(sel,copy);}
  async function doUnlockRepos(){const ne=Object.assign({},entries);delete ne[sel];setEntries(ne);setForm(makeE0());await deleteEntry(sel);}
  async function doEditSave(date,nf){const data=Object.assign({},nf,{_locked:true});const ne=Object.assign({},entries);ne[date]=data;setEntries(ne);await saveEntry(date,data);setEditDay(null);}
  async function doDelete(date){const ne=Object.assign({},entries);delete ne[date];setEntries(ne);await deleteEntry(date);setDeleteConfirm(null);}
  async function doReset(){
    await sb.from("entries").delete().neq("date","__never__");
    setEntries({});setSel(DATE_MIN);
  }

  const af=useMemo(()=>Object.entries(entries).sort((a,b)=>a[0].localeCompare(b[0])),[entries]);
  const nextDay=useMemo(()=>computeNextDay(entries),[entries]);
  const afActive=useMemo(()=>af.filter(p=>!p[1]._repos),[af]);
  const gO=d=>getObjForDay(new Date(d+"T00:00:00").getDay(),oS,oR,oTP,dayObjs);
  const sd=useMemo(()=>afActive.map((pair,i,arr)=>{const d=pair[0],e=pair[1],o=gO(d);const w7=arr.slice(Math.max(0,i-6),i+1).map(p=>{const wo=gO(p[0]);return sJour(p[1],wo.oS,wo.oR,wo.oTP);}).filter(x=>x!=null);return{date:fD(d),jour:sJour(e,o.oS,o.oR,o.oTP),hyg:sHyg(e,o.oS,o.oTP),mental:sEtatMental(e),perf:sPerf2(e,o.oR),ma7:avg(w7)}}),[afActive,oS,oR,oTP,dayObjs]);
  const wd=useMemo(()=>WDATA.map(w=>Object.assign({},w,ga(af.filter(p=>p[0]>=w.start&&p[0]<=w.end),oS,oR,oTP,dayObjs))),[af,oS,oR,oTP,dayObjs]);
  const md=useMemo(()=>{const base=MDATA.map(m=>Object.assign({label:m.lb},ga(af.filter(p=>p[0]>=m.s&&p[0]<=m.e),oS,oR,oTP,dayObjs)));return base.map((m,i)=>{const w3=base.slice(Math.max(0,i-2),i+1).map(x=>x.score).filter(x=>x!=null);return Object.assign({},m,{ma3:avg(w3)});});},[af,oS,oR,oTP,dayObjs]);
  const wdMa30=useMemo(()=>wd.filter(w=>w.score!=null).map(w=>{const endDt=new Date(w.end+"T00:00:00"),startDt=new Date(endDt);startDt.setDate(startDt.getDate()-29);const rel=af.filter(p=>p[0]>=startDt.toISOString().slice(0,10)&&p[0]<=w.end&&!p[1]._repos);return Object.assign({},w,{label:"S"+w.num,ma30:avg(rel.map(p=>{const o=gO(p[0]);return sJour(p[1],o.oS,o.oR,o.oTP);}))});}),[wd,af,oS,oR,oTP,dayObjs]);
  const cmb=useMemo(()=>afActive.map(pair=>{const d=pair[0],e=pair[1],o=gO(d),si=toN(e.stress)!=null?10-toN(e.stress):null;return{date:fD(d),jour:sJour(e,o.oS,o.oR,o.oTP),hyg:sHyg(e,o.oS,o.oTP),mental:sEtatMental(e),perf:sPerf2(e,o.oR),so:normHSom(toN(e.sommeil),o.oS),hu:toN(e.humeur),si,sa:toN(e.satisfaction),rv:normHRev(toN(e.revisions),o.oR),co:toN(e.concentration),ef:toN(e.efficacite),al:toN(e.alim),tp:normHTP(toN(e.tempsPerso),o.oTP),di:toN(e.difficulte),cf:toN(e.confiance)};}),[afActive,oS,oR,oTP,dayObjs]);
  const aG=avg(afActive.map(p=>{const o=gO(p[0]);return sJour(p[1],o.oS,o.oR,o.oTP);}));
  const aHyg=avg(afActive.map(p=>{const o=gO(p[0]);return sHyg(p[1],o.oS,o.oTP);}));
  const aMental=avg(afActive.map(p=>sEtatMental(p[1])));
  const aPerf=avg(afActive.map(p=>sPerf2(p[1],gO(p[0]).oR)));
  const pData=per==="mensuel"?md:wd.filter(w=>w.jours>0).map(w=>Object.assign({},w,{label:"S"+w.num}));
  const jours=useMemo(()=>af.slice().reverse().map(pair=>{const d=pair[0],e=pair[1],repos=!!e._repos;if(repos)return{d,fd:fD(d),repos:true,lck:true};const o=gO(d);return{d,fd:fD(d),repos:false,g:sJour(e,o.oS,o.oR,o.oTP),hyg:sHyg(e,o.oS,o.oTP),mental:sEtatMental(e),perf:sPerf2(e,o.oR),lck:!!(e._locked),so:toN(e.sommeil),hu:toN(e.humeur),st:toN(e.stress),sa:toN(e.satisfaction),cf:toN(e.confiance),rv:toN(e.revisions),co:toN(e.concentration),ef:toN(e.efficacite),pa:e.pauses,sp:e.sport,al:toN(e.alim),tp:toN(e.tempsPerso),di:toN(e.difficulte)};}),[af,oS,oR,oTP,dayObjs]);
  const lG=sJour(form,selObj.oS,selObj.oR,selObj.oTP),lHyg=sHyg(form,selObj.oS,selObj.oTP),lMental=sEtatMental(form),lPerf=sPerf2(form,selObj.oR);
  const saisieIp=getInterp(lPerf,lHyg);
  const concMalus=form.revisions>0&&form.concentration<5?(5-form.concentration)*0.5:0;
  const effMalus=form.revisions>0&&form.efficacite<5?(5-form.efficacite)*0.5:0;
  const revData=revPer==="hebdo"?wd.filter(w=>w.rev!=null).map(w=>({label:"S"+w.num,rev:w.rev})):md.filter(m=>m.rev!=null).map(m=>({label:m.label,rev:m.rev}));

  if(loading)return <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100vh",color:C.mu,background:"#E4D6BC",gap:12}}><AscMedallion size={52} color={C.pr}/><div style={{fontSize:12,fontWeight:600,color:C.mu}}>Chargement des données…</div></div>;

  function renderDash(){return(<div><PageTitle eyebrow="Vue d'ensemble" title="Dashboard annuel" sub="Scores sur 1 décimale · repos exclus"/><Bx sx={{padding:"14px 16px",marginBottom:8,display:"flex",alignItems:"center",justifyContent:"space-between"}}><div><div style={{display:"flex",alignItems:"center",gap:5,fontSize:9,color:C.mu,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.8px",marginBottom:5}}><Ic n="Sparkles" size={11} color={C.sc} sw={2}/>Score du jour moy.</div><div style={{fontSize:32,fontWeight:800,color:cc(aG),lineHeight:1}}>{f1(aG)}<span style={{fontSize:12,color:C.mu}}>/10</span></div></div><div style={{width:58,height:58,borderRadius:"50%",background:"conic-gradient("+cc(aG)+" "+(aG||0)/10*360+"deg,"+C.bd+" 0deg)",display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{width:44,height:44,borderRadius:"50%",background:C.card,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:12.5,color:cc(aG)}}>{f1(aG)}</div></div></Bx><div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:7,marginBottom:12}}>{[[aHyg,"Hygiène",C.hy,"Leaf"],[aMental,"État mental",C.me,"Brain"],[aPerf,"Performance",C.tr,"Target"]].map(arr=>(<Bx key={arr[1]} sx={{padding:"10px 11px",borderLeft:"3px solid "+arr[2]}}><div style={{display:"flex",alignItems:"center",gap:4,fontSize:8,color:C.mu,fontWeight:700,marginBottom:4}}><Ic n={arr[3]} size={10} color={arr[2]} sw={2}/>{arr[1]}</div><div style={{fontSize:19,fontWeight:800,color:arr[2]}}>{f1(arr[0])}<span style={{fontSize:8,color:C.mu}}>/10</span></div></Bx>))}</div><GrC title="Évolution des scores" icon="TrendingUp" action={<div style={{display:"flex",gap:3,flexWrap:"wrap",justifyContent:"flex-end"}}>{[["jour","Score",C.sc],["hyg","Hyg.",C.hy],["mental","Mental",C.me],["perf","Perf.",C.tr]].map(arr=>(<button key={arr[0]} onClick={()=>setCatV(p=>({...p,[arr[0]]:!p[arr[0]]}))} style={{background:catV[arr[0]]?arr[2]:C.bg,color:catV[arr[0]]?"#fff":C.mu,border:"1px solid "+ itle="Mental — moy." icon="Brain" color={C.me} items={[["Humeur",f1(m.humeur)+"/10",m.humeur,10,C.me],["Stress",f1(m.stress)+"/10",m.stress,10,C.me],["Satisfaction",f1(m.satisfaction)+"/10",m.satisfaction,10,C.me],["Confiance",f1(m.conf)+"/10",m.conf,10,C.me]]}/><SecBlock title="Travail — moy." icon="BookOpen" color={C.tr} items={[["Révisions",fH(m.rev),m.rev,14,C.tr],["Concentration",f1(m.conc)+"/10",m.conc,10,C.tr],["Efficacité",f1(m.eff)+"/10",m.eff,10,C.tr],["Difficulté",f1(m.diff)+"/10",m.diff,10,C.tr]]}/></div></Bx>))}</div>)}</div>)}{stab==="graphs"&&(<div><GrC title="Scores hebdomadaires" icon="TrendingUp"><ResponsiveContainer width="100%" height={140}><LineChart data={wd.filter(w=>w.score!=null)}><CartesianGrid strokeDasharray="3 3" stroke={C.bd}/><XAxis dataKey="num" tick={{fontSize:7,fill:C.mu}} tickFormatter={v=>"S"+v}/><YAxis domain={[0,10]} tick={{fontSize:7,fill:C.mu}} width={18}/><Tooltip {...TTP} formatter={v=>f1(v)} labelFormatter={v=>"Semaine "+v}/><Legend iconSize={7} wrapperStyle={{fontSize:9}}/><Line type="monotone" dataKey="score" stroke={C.sc} strokeWidth={2.2} dot={{r:2}} name="Score du jour"/><Line type="monotone" dataKey="hyg" stroke={C.hy} strokeWidth={1.6} dot={false} name="Hygiène"/><Line type="monotone" dataKey="mental" stroke={C.me} strokeWidth={1.6} dot={false} name="État mental"/><Line type="monotone" dataKey="perf" stroke={C.tr} strokeWidth={1.6} dot={false} name="Performance"/></LineChart></ResponsiveContainer></GrC><GrC title="Évolution mensuelle" icon="TrendingUp"><ResponsiveContainer width="100%" height={140}><LineChart data={md}><CartesianGrid strokeDasharray="3 3" stroke={C.bd}/><XAxis dataKey="label" tick={{fontSize:7,fill:C.mu}}/><YAxis domain={[0,10]} tick={{fontSize:7,fill:C.mu}} width={18}/><Tooltip {...TTP} formatter={v=>v?f1(v):"—"}/><Legend iconSize={7} wrapperStyle={{fontSize:9}}/><Line type="monotone" dataKey="score" stroke={C.sc} strokeWidth={2.2} dot={{r:3}} name="Score du jour"/><Line type="monotone" dataKey="hyg" stroke={C.hy} strokeWidth={1.6} dot={{r:2}} name="Hygiène"/><Line type="monotone" dataKey="mental" stroke={C.me} strokeWidth={1.6} dot={{r:2}} name="État mental"/><Line type="monotone" dataKey="perf" stroke={C.tr} strokeWidth={1.6} dot={{r:2}} name="Performance"/></LineChart></ResponsiveContainer></GrC><GrC title="Révisions" icon="NotebookPen" iconColor={C.tr} action={<SegGroup opts={[["hebdo","Sem."],["mensuel","Mois"]]} active={revPer} onPick={setRevPer} activeColor={C.tr}/>}><ResponsiveContainer width="100%" height={115}><BarChart data={revData}><CartesianGrid strokeDasharray="3 3" stroke={C.bd}/><XAxis dataKey="label" tick={{fontSize:7,fill:C.mu}}/><YAxis tick={{fontSize:7,fill:C.mu}} width={18}/><Tooltip {...TTP} formatter={v=>fH(v)}/><Bar dataKey="rev" fill={C.tr} radius={[4,4,0,0]}/></BarChart></ResponsiveContainer></GrC><GrC title="Comparaison personnalisée" icon="Layers"><div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:10}}>{ALL_METRICS.map(m=><button key={m.k} onClick={()=>toggleMet(m.k)} style={{background:selMets.has(m.k)?m.c:C.bg,color:selMets.has(m.k)?"#fff":C.mu,border:"1px solid "+(selMets.has(m.k)?m.c:C.bd),borderRadius:20,padding:"3px 10px",cursor:"pointer",fontSize:9,fontWeight:600}}>{m.lb}</button>)}</div>{selMets.size===0&&<div style={{textAlign:"center",color:C.mu,fontSize:11,padding:"16px 0"}}>Sélectionne au moins une donnée</div>}{selMets.size>0&&(<ResponsiveContainer width="100%" height={155}><LineChart data={cmb}><CartesianGrid strokeDasharray="3 3" stroke={C.bd}/><XAxis dataKey="date" tick={{fontSize:7,fill:C.mu}} interval={vi(cmb.length)}/><YAxis domain={[0,10]} tick={{fontSize:7,fill:C.mu}} width={18}/><Tooltip {...TTP} formatter={v=>f1(v)}/><Legend iconSize={7} wrapperStyle={{fontSize:9}}/>{ALL_METRICS.filter(m=>selMets.has(m.k)).map(m=><Line key={m.k} type="monotone" dataKey={m.k} stroke={m.c} dot={false} strokeWidth={1.6} name={m.lb}/>)}</LineChart></ResponsiveContainer>)}</GrC></div>)}</div>);}

  const editDow=editDay?new Date(editDay+"T00:00:00").getDay():0;
  const editObj=editDay?getObjForDay(editDow,oS,oR,oTP,dayObjs):{oS,oR,oTP};

  return(<div style={{minHeight:"100vh",background:"#E4D6BC",fontFamily:"'Hanken Grotesk',system-ui,sans-serif"}}>
    <div style={{maxWidth:430,margin:"0 auto",minHeight:"100vh",backgroundColor:C.bg,backgroundImage:"repeating-linear-gradient(90deg,rgba(150,120,60,.020) 0 1px,transparent 1px 6px),radial-gradient(130% 55% at 50% 0%,rgba(199,161,78,.07),transparent 60%)",boxShadow:"0 0 40px rgba(80,60,30,.10)",position:"relative",color:C.tx}}>
      {showCal&&<Cal sel={sel} onSel={setSel} entries={entries} onClose={()=>setShowCal(false)}/>}
      {showSettings&&<SettingsModal entries={entries} onReset={doReset} onClose={()=>setShowSettings(false)} oS={oS} oR={oR} oTP={oTP} setOS={setOS} setOR={setOR} setOTP={setOTP} dayObjs={dayObjs} setDayObjs={setDayObjs} saveSettings={saveSettings}/>}
      {editDay&&!entries[editDay]?._repos&&<EditModal day={editDay} entry={entries[editDay]} onSave={f=>doEditSave(editDay,f)} onClose={()=>setEditDay(null)} oS={editObj.oS} oR={editObj.oR} oTP={editObj.oTP}/>}
      {deleteConfirm&&(<div style={{position:"fixed",inset:0,background:"rgba(59,52,42,.45)",zIndex:500,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}><div style={{background:C.card,borderRadius:18,padding:"20px 18px",maxWidth:300,width:"100%",boxShadow:"0 14px 40px rgba(59,52,42,.25)"}}><div style={{display:"flex",alignItems:"center",gap:8,fontSize:15,fontWeight:700,marginBottom:6,color:C.tx}}><Ic n="Trash2" size={17} color={C.st} sw={2}/>Supprimer cette journée ?</div><div style={{fontSize:11,color:C.mu,marginBottom:18}}>{new Date(deleteConfirm+"T00:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})} · Action irréversible.</div><div style={{display:"flex",gap:8}}><button onClick={()=>setDeleteConfirm(null)} style={{flex:1,background:C.bg,border:"1px solid "+C.bd,borderRadius:11,padding:"10px",cursor:"pointer",fontWeight:600,fontSize:12,color:C.tx}}>Annuler</button><button onClick={()=>doDelete(deleteConfirm)} style={{flex:1,background:C.st,color:"#fff",border:"none",borderRadius:11,padding:"10px",cursor:"pointer",fontWeight:700,fontSize:12}}>Supprimer</button></div></div></div>)}

      {/* HEADER */}
      <div style={{background:C.card,borderBottom:"1px solid "+C.bd,padding:"11px 16px",position:"sticky",top:0,zIndex:100,boxShadow:"0 1px 8px rgba(80,60,30,.05)"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{display:"flex",alignItems:"center",gap:9}}>
            <AscMedallion size={38} color="#3F6E76" style={{filter:"drop-shadow(0 2px 5px rgba(80,60,30,.18))"}}/>
            <div style={{lineHeight:1}}><div style={{display:"flex",alignItems:"baseline",gap:7}}><span style={{...SERIF,fontSize:17,fontWeight:700,color:C.tx,letterSpacing:"0.5px"}}>PASS</span><span style={{fontSize:11,fontWeight:600,color:C.gold,letterSpacing:"2px"}}>TRACKER</span></div><div style={{fontSize:8,color:C.mu,letterSpacing:"1px",marginTop:2}}>MÉDECINE · 2026–27</div></div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            {syncStatus==="saving"&&<div style={{width:6,height:6,borderRadius:"50%",background:C.gold,animation:"pulse 1s infinite"}}/>}
            {syncStatus==="error"&&<div style={{fontSize:8,color:C.st,fontWeight:700}}>⚠ sync</div>}
            <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:2}}>
              <span style={{fontSize:10.5,fontWeight:700,color:C.pr}}>{af.length}<span style={{color:C.mu,fontWeight:400}}>/{TOTAL_DAYS}</span><span style={{color:C.gold,fontSize:9,marginLeft:4,fontWeight:700}}>{Math.round((af.length/TOTAL_DAYS)*100)}%</span></span>
              <div style={{width:58,height:4,background:C.bd,borderRadius:4}}><div style={{height:"100%",width:(af.length/TOTAL_DAYS*100)+"%",background:"linear-gradient(90deg,"+C.gold+","+C.tr+")",borderRadius:4}}/></div>
            </div>
            <button onClick={()=>setShowSettings(true)} style={{width:32,height:32,borderRadius:10,background:C.bg,border:"1px solid "+C.bd,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><Ic n="Settings" size={16} color={C.pr} sw={2}/></button>
          </div>
        </div>
      </div>

      <div style={{padding:"16px 14px 86px"}}>
        {page==="dash"&&renderDash()}
        {page==="saisie"&&renderSaisie()}
        {page==="suivi"&&renderSuivi()}
      </div>

      <nav style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:430,background:C.card,borderTop:"1px solid "+C.bd,display:"flex",zIndex:100,boxShadow:"0 -2px 14px rgba(80,60,30,.06)"}}>
        {[["dash","LayoutDashboard","Dashboard"],["saisie","SquarePen","Saisie"],["suivi","TrendingUp","Suivi"]].map(arr=>{const on=page===arr[0];return(<button key={arr[0]} onClick={()=>setPage(arr[0])} style={{flex:1,background:"none",border:"none",cursor:"pointer",padding:"10px 0 7px",display:"flex",flexDirection:"column",alignItems:"center",gap:3}}><Ic n={arr[1]} size={21} color={on?C.pr:C.mu} sw={on?2.2:1.8}/><span style={{fontSize:9,fontWeight:on?700:500,color:on?C.pr:C.mu}}>{arr[2]}</span>{on?<div style={{width:20,height:3,borderRadius:2,background:C.gold}}/>:<div style={{height:3}}/>}</button>);})}
      </nav>
    </div>
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
