<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="PASS Tracker"/>

<title>PASS Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#E4D6BC;font-family:'Hanken Grotesk',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;}
input[type=range]{-webkit-appearance:none;appearance:none;height:5px;border-radius:4px;background:rgba(150,120,60,.18);}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:#fff;border:2px solid currentColor;box-shadow:0 1px 3px rgba(80,60,30,.25);cursor:pointer;}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:#fff;border:2px solid currentColor;cursor:pointer;}
::-webkit-scrollbar{width:0;}
</style>
</head>
<body>
<div id="root"><div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#E4D6BC;color:#A4957B;font-family:sans-serif;font-size:13px;">Chargement…</div></div>
<script src="./bundle.js"></script>
</body>
</html>
